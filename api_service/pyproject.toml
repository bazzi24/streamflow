[project]
name = "streamflow-api"
version = "0.1.0"
description = "StreamFlow FastAPI service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic-settings==2.6.0",
    "sqlalchemy==2.0.36",
    "pymysql==1.1.0",
    "cryptography==43.0.0",
    "aiokafka==0.12.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.2.1",
    "python-multipart==0.0.20",
    "email-validator==2.0.0",
    "alembic==1.13.0",
    "slowapi==0.1.9",
    "httpx==0.27.0",
]

[dependency-groups]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "httpx==0.27.0",
    "testcontainers==4.8.0",
    "faker==25.0.0",
    "bandit==1.7.8",
]
test = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "httpx==0.27.0",
    "testcontainers==4.8.0",
    "faker==25.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--disable-warnings",
    "--color=yes",
]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "security: security tests",
    "slow: slow running tests",
    "kafka: tests requiring Kafka",
    "database: tests requiring database",
]
skip_database_tests = true

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/alembic/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]
