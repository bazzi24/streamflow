    "sqlalchemy==2.0.36",
    "pymysql>=1.1.0",
    "cryptography>=43.0.0",
    "aiokafka==0.12.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
