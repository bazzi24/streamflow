[project]
name = "streamflow"
version = "0.1.0"
description = "Real-time Data Pipeline using Spark, Kafka, MySQL"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests==2.32.0",
    "pandas==2.2.3",
    "sqlalchemy==2.0.36",
    "pymysql==1.1.0",
    "kafka-python==2.1.1",
    "selenium==4.8.0",
    "beautifulsoup4==4.12.3",
    "tqdm==4.66.4",
    "pyspark==3.5.1",
    "python-dateutil==2.8.2",
    "numpy==2.0.0",
    "python-dotenv==1.0.1",
    "ssi-fc-data==2.2.2",
    "strenum==0.4.15",
    "itsdangerous==2.2.0",
    "peewee==3.19.0",
    "xxhash==3.6.0",
    "websocket-client==1.7.0",
]

[dependency-groups]
dev = [
    "black==24.4.2",
    "ipykernel==0.29.0",
    "jupyterlab==4.2.0",
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "bandit==1.7.8",
    "mypy==1.10.0",
